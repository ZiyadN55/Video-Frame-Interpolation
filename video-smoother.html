<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Video Smoother</title>
<style>
:root{--bg:#fff;--fg:#111;--mut:#666;--card:#f2f2f4;--ac:#3b6cff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121214;--fg:#eee;--mut:#999;--card:#1e1e22}}
:root[data-theme="dark"]{--bg:#121214;--fg:#eee;--mut:#999;--card:#1e1e22}
body{margin:0;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif;padding:16px;max-width:520px;margin:auto}
h1{font-size:20px;margin:0 0 4px}p{color:var(--mut);margin:4px 0 12px}
.c{background:var(--card);border-radius:12px;padding:12px;margin-bottom:12px}
button,select,input[type=file],input[type=number]{font:inherit;width:100%;padding:11px;border-radius:10px;border:0;margin-top:8px;box-sizing:border-box}
button{background:var(--ac);color:#fff;font-weight:600}button:disabled{opacity:.4}
button.s{background:#d33}select{background:var(--bg);color:var(--fg)}
video,canvas{width:100%;border-radius:8px;background:#000;display:block;max-height:40vh}
progress{width:100%;margin-top:8px}#st{color:var(--mut);font-size:13px;margin-top:6px}
a.dl{display:block;text-align:center;background:#1a9b55;color:#fff;padding:11px;border-radius:10px;text-decoration:none;margin-top:8px;font-weight:600}
</style></head><body>
<h1>Video Smoother</h1>
<p>Isi frame beku/drop pakai frame blending. Proses real-time, jalan di browser, nggak ada upload.</p>
<div class="c">
<input type="file" id="f" accept="video/*">
<select id="q"><option value="1280">Maks 1280px (hemat RAM)</option><option value="1920">Maks 1920px</option><option value="854">Maks 854px (paling ringan)</option></select>
<select id="m"><option value="blend">Metode: Frame blending (cepat)</option><option value="flow">Metode: Optical flow (lebih halus, lambat)</option></select>
<input type="number" id="fps" value="30" min="10" max="120" step="any" placeholder="Output FPS (10-120)">
<button id="go" disabled>Mulai proses</button>
<button id="stop" class="s" style="display:none">Stop & simpan</button>
<progress id="p" value="0" max="1" style="display:none"></progress>
<div id="st">Pilih video dulu.</div>
</div>
<div class="c" id="pv" style="display:none"><canvas id="cv"></canvas><div id="out"></div></div>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.js"></script>
<video id="v" playsinline muted style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"></video>
<script>
const $=id=>document.getElementById(id),v=$('v'),cv=$('cv'),ctx=cv.getContext('2d');
const D=0.6,st=t=>$('st').textContent=t;
let url,fl,run=false,ending=false,frames=[],last=null,raf,n=0,FPS=30,endT=0,ve,mux,fin=false;
let mode='blend',gl,glc,pg,U,ftx,cA,cB,lw,lh,gw,gh,gsx;
const sm=document.createElement('canvas');sm.width=32;sm.height=18;const sx=sm.getContext('2d',{willReadFrequently:true});
$('f').onchange=e=>{fl=e.target.files[0];if(!fl)return;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(fl);v.src=url;v.onloadedmetadata=()=>{$('go').disabled=false;st(`Siap: ${v.videoWidth}x${v.videoHeight}, ${v.duration.toFixed(1)} detik. Proses butuh waktu sepanjang durasi video.`)};v.onerror=()=>st('Format video nggak didukung browser ini.')};
function diff(){sx.drawImage(v,0,0,32,18);const d=sx.getImageData(0,0,32,18).data;let s=0;if(last)for(let i=0;i<d.length;i+=4)s+=Math.abs(d[i]-last[i])+Math.abs(d[i+1]-last[i+1])+Math.abs(d[i+2]-last[i+2]);const u=!last||s/1728>0.8;if(u)last=d;return u}
const VS='attribute vec2 p;varying vec2 uv;void main(){uv=vec2(p.x*.5+.5,.5-p.y*.5);gl_Position=vec4(p,0.,1.);}';
const FS='#ifdef GL_FRAGMENT_PRECISION_HIGH\nprecision highp float;\n#else\nprecision mediump float;\n#endif\nvarying vec2 uv;uniform sampler2D A,B,F;uniform float a;uniform vec2 px,fs;void main(){float ed=smoothstep(0.,.08,min(min(uv.x,1.-uv.x),min(uv.y,1.-uv.y)));vec2 f=texture2D(F,uv*fs).rg*255.0-127.0;f=(texture2D(F,(uv-a*f*px)*fs).rg*255.0-127.0)*.9*ed;vec2 d=f*px;vec4 wa=texture2D(A,uv-a*d),wb=texture2D(B,uv+(1.0-a)*d);vec4 w=mix(wa,wb,a),q=mix(texture2D(A,uv),texture2D(B,uv),a);gl_FragColor=mix(w,q,smoothstep(.18,.5,length(wa.rgb-wb.rgb)));}';
function newTex(){const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);[[gl.TEXTURE_MIN_FILTER,gl.LINEAR],[gl.TEXTURE_MAG_FILTER,gl.LINEAR],[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE]].forEach(([k,x])=>gl.texParameteri(gl.TEXTURE_2D,k,x));return t}
function initGL(){
 try{glc=document.createElement('canvas');glc.width=cv.width;glc.height=cv.height;
 gl=glc.getContext('webgl',{preserveDrawingBuffer:true});if(!gl)return false;
 const sh=(t,c)=>{const o=gl.createShader(t);gl.shaderSource(o,c);gl.compileShader(o);return o};
 pg=gl.createProgram();gl.attachShader(pg,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pg,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pg);
 if(!gl.getProgramParameter(pg,gl.LINK_STATUS))return false;
 gl.useProgram(pg);gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
 const l=gl.getAttribLocation(pg,'p');gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,2,gl.FLOAT,false,0,0);
 ['A','B','F'].forEach((k,i)=>gl.uniform1i(gl.getUniformLocation(pg,k),i));
 U={a:gl.getUniformLocation(pg,'a')};gl.uniform2f(gl.getUniformLocation(pg,'px'),1/lw,1/lh);gl.uniform2f(gl.getUniformLocation(pg,'fs'),lw/(gw*4),lh/(gh*4));gl.viewport(0,0,cv.width,cv.height);
 gl.activeTexture(gl.TEXTURE2);ftx=newTex();cA=cB=null;return true}catch(e){return false}}
function sad(a,b,W,x0,y0,x1,y1,lim){let s=0;for(let r=0;r<8;r++){let p=(y0+r)*W+x0,q=(y1+r)*W+x1;for(let c=0;c<8;c++){const d=a[p+c]-b[q+c];s+=d<0?-d:d}if(s>=lim)return s}return s}
function med(a){const o=new Int8Array(a.length),w=[];for(let j=0;j<gh;j++)for(let i=0;i<gw;i++){w.length=0;for(let y=-1;y<=1;y++)for(let x=-1;x<=1;x++)w.push(a[Math.min(gh-1,Math.max(0,j+y))*gw+Math.min(gw-1,Math.max(0,i+x))]);w.sort((p,q)=>p-q);o[j*gw+i]=w[4]}return o}
function flow(A,B){
 const a=A.g,b=B.g,W=lw,H=lh,Rg=8,dx=new Int8Array(gw*gh),dy=new Int8Array(gw*gh);
 for(let j=0;j<gh;j++)for(let i=0;i<gw;i++){
  const bx=Math.min(Math.max(i*4-2,0),W-8),by=Math.min(Math.max(j*4-2,0),H-8);
  let best=sad(a,b,W,bx,by,bx,by,1e9);if(best<256)continue;
  let mx=0,my=0;
  for(let oy=-Rg;oy<=Rg;oy++){const ty=by+oy;if(ty<0||ty+8>H)continue;
   for(let ox=-Rg;ox<=Rg;ox++){const tx=bx+ox;if(tx<0||tx+8>W||(!ox&&!oy))continue;
    const lim=best*0.85,s=sad(a,b,W,bx,by,tx,ty,lim);if(s<lim){best=s;mx=ox;my=oy}}}
  dx[j*gw+i]=mx;dy[j*gw+i]=my}
 const X=med(med(dx)),Y=med(med(dy)),o=new Uint8Array(gw*gh*4);
 for(let k=0;k<gw*gh;k++){o[k*4]=X[k]+127;o[k*4+1]=Y[k]+127;o[k*4+3]=255}return o}
function glDraw(A,B,al){
 gl.activeTexture(gl.TEXTURE0);
 for(const f of [A,B])if(!f.tx){f.tx=newTex();gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,f.b)}
 gl.activeTexture(gl.TEXTURE2);gl.bindTexture(gl.TEXTURE_2D,ftx);
 if(cA!==A||cB!==B){cA=A;cB=B;gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gw,gh,0,gl.RGBA,gl.UNSIGNED_BYTE,flow(A,B))}
 gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,A.tx);gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,B.tx);
 gl.uniform1f(U.a,al);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);ctx.globalAlpha=1;ctx.drawImage(glc,0,0)}
function drop(f){f.b.close();if(f.tx&&gl)gl.deleteTexture(f.tx)}
const gs=document.createElement('canvas');
async function onFrame(now,meta){
 if(!run)return;
 try{if(diff()){const b=await createImageBitmap(v,{resizeWidth:cv.width,resizeHeight:cv.height}),f={t:meta.mediaTime,b};if(mode=='flow'){gsx.drawImage(b,0,0,lw,lh);const d=gsx.getImageData(0,0,lw,lh).data,g=new Uint8Array(lw*lh);for(let i=0;i<g.length;i++)g[i]=(d[i*4]*77+d[i*4+1]*150+d[i*4+2]*29)>>8;f.g=g}frames.push(f)}}catch(e){}
 v.requestVideoFrameCallback(onFrame)}
function emit(t){
 let i=0;while(i+1<frames.length&&frames[i+1].t<=t)i++;
 const A=frames[i],B=frames[i+1];
 if(B&&B.t>t&&t>=A.t&&B.t-A.t>1.2/FPS){const al=(t-A.t)/(B.t-A.t);
  if(mode=='flow')glDraw(A,B,al);else{ctx.globalAlpha=1;ctx.drawImage(A.b,0,0);ctx.globalAlpha=al;ctx.drawImage(B.b,0,0);ctx.globalAlpha=1}}
 else{ctx.globalAlpha=1;ctx.drawImage(A.b,0,0)}
 const f=new VideoFrame(cv,{timestamp:Math.round(t*1e6),duration:Math.round(1e6/FPS)});
 ve.encode(f,{keyFrame:n%Math.round(FPS*2)==0});f.close();
 while(frames.length>2&&frames[1].t<=t)drop(frames.shift())}
function tick(){
 if(!run)return;raf=requestAnimationFrame(tick);
 const lag=frames.length?v.currentTime-D-n/FPS:0;
 if(!ending){const q=ve.encodeQueueSize;if((q>8||lag>0.5)&&!v.paused)v.pause();else if(q<3&&lag<0.15&&v.paused)v.play().catch(()=>{})}
 const lim=ending?1e9:v.currentTime-D;let k=0;
 while(frames.length&&n/FPS<endT&&n/FPS<=lim&&k++<(mode=='flow'?3:8)&&ve.encodeQueueSize<12){emit(n/FPS);n++}
 $('p').value=Math.min(1,n/FPS/endT);
 if(n/FPS>=endT||(ending&&!frames.length))finish()}
$('go').onclick=async()=>{
 try{
 if(!window.VideoEncoder||!window.Mp4Muxer)return st('Browser nggak support WebCodecs, atau library gagal load (butuh internet). Pakai Chrome terbaru.');
 FPS=Math.min(120,Math.max(10,+$('fps').value||30));mode=$('m').value;const mx=+$('q').value,r=Math.min(1,mx/Math.max(v.videoWidth,v.videoHeight));
 cv.width=Math.round(v.videoWidth*r/2)*2;cv.height=Math.round(v.videoHeight*r/2)*2;
 frames=[];last=null;n=0;ending=false;fin=false;endT=v.duration;
 const sc=256/Math.max(cv.width,cv.height);lw=Math.max(16,Math.round(cv.width*sc));lh=Math.max(16,Math.round(cv.height*sc));gw=Math.ceil(lw/4);gh=Math.ceil(lh/4);
 if(mode=='flow'){gs.width=lw;gs.height=lh;gsx=gs.getContext('2d',{willReadFrequently:true});if(!initGL()){mode='blend';alert('WebGL nggak tersedia, pakai frame blending.')}}
 $('go').disabled=true;st('Menyiapkan audio...');
 let buf=null,nch=2,sr=48000,ae=null;
 try{const ac=new AudioContext({sampleRate:48000});buf=await ac.decodeAudioData(await fl.arrayBuffer());ac.close();nch=Math.min(2,buf.numberOfChannels);sr=buf.sampleRate;
  const cfg={codec:'mp4a.40.2',sampleRate:sr,numberOfChannels:nch,bitrate:128000};
  if(!(await AudioEncoder.isConfigSupported(cfg)).supported)throw 0;buf.cfg=cfg}catch(e){buf=null}
 let vc=null;const vcfg={width:cv.width,height:cv.height,bitrate:Math.round(cv.width*cv.height*FPS*0.2),framerate:FPS};
 for(const c of ['avc1.64002A','avc1.4D002A','avc1.42002A']){try{if((await VideoEncoder.isConfigSupported({...vcfg,codec:c})).supported){vc=c;break}}catch(e){}}
 if(!vc)return st('Browser nggak bisa encode H.264 di resolusi/FPS ini. Coba FPS atau resolusi lebih kecil.');
 mux=new Mp4Muxer.Muxer({target:new Mp4Muxer.ArrayBufferTarget(),video:{codec:'avc',width:cv.width,height:cv.height},...(buf?{audio:{codec:'aac',numberOfChannels:nch,sampleRate:sr}}:{}),fastStart:'in-memory'});
 ve=new VideoEncoder({output:(c,m)=>mux.addVideoChunk(c,m),error:e=>st('Error encoder: '+e.message)});
 ve.configure({...vcfg,codec:vc});
 if(buf){ae=new AudioEncoder({output:(c,m)=>mux.addAudioChunk(c,m),error:()=>{}});ae.configure(buf.cfg);
  for(let o=0;o<buf.length;o+=sr){const m=Math.min(sr,buf.length-o),d=new Float32Array(m*nch);for(let c=0;c<nch;c++)d.set(buf.getChannelData(c).subarray(o,o+m),c*m);
   const a=new AudioData({format:'f32-planar',sampleRate:sr,numberOfFrames:m,numberOfChannels:nch,timestamp:Math.round(o/sr*1e6),data:d});ae.encode(a);a.close()}
  await ae.flush();ae.close();buf=null}
 else st('Audio nggak bisa diproses, hasil tanpa suara. Memproses...');
 v.muted=true;v.playbackRate=mode=='flow'?0.5:1;v.currentTime=0;await new Promise(r=>v.onseeked=r);
 run=true;await v.play();v.requestVideoFrameCallback(onFrame);tick();
 $('go').style.display='none';$('stop').style.display='block';$('p').style.display='block';$('pv').style.display='block';$('out').innerHTML='';
 if(ae)st('Memproses... jangan tutup tab / matikan layar.');
 v.onended=()=>setTimeout(()=>{ending=true},400);
 }catch(e){st('Gagal: '+(e.message||e));$('go').disabled=false}};
$('stop').onclick=()=>{endT=n/FPS;ending=true;v.pause()};
async function finish(){
 if(fin)return;fin=true;run=false;cancelAnimationFrame(raf);v.pause();
 try{await ve.flush();ve.close();mux.finalize();
  const blob=new Blob([mux.target.buffer],{type:'video/mp4'}),u=URL.createObjectURL(blob);
  $('out').innerHTML=`<a class="dl" href="${u}" download="smoothed.mp4">Download hasil (${(blob.size/1048576).toFixed(1)} MB)</a>`;
  st('Selesai. Pilih video lagi kalau mau ulang.')}catch(e){st('Gagal simpan: '+e.message)}
 frames.forEach(drop);frames=[];mux=null;if(gl){const x=gl.getExtension('WEBGL_lose_context');if(x)x.loseContext();gl=null}
 $('stop').style.display='none';$('go').style.display='block';$('p').style.display='none';$('f').value='';$('go').disabled=true}
</script></body></html>
